<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Innovation 4 Impact minimalist colour palette</title>
  <desc id="desc">Five colour swatches: TET Signal Orange, Deep Evergreen, Insight Ink, Warm Canvas, and White.</desc>

  <rect width="1600" height="900" fill="#F7F4EE"/>

  <text x="100" y="108" fill="#1E2528" font-family="Pathway Extreme, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="5">I4I CENTRE</text>
  <text x="100" y="176" fill="#1E2528" font-family="Pathway Extreme, Arial, sans-serif" font-size="60" font-weight="700">Innovation 4 Impact</text>
  <text x="100" y="224" fill="#176B5B" font-family="Pathway Extreme, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="1.5">INNOVATION · INSIGHTS · IMPACT · SUSTAINABILITY</text>

  <g transform="translate(100 300)">
    <rect x="0" y="0" width="420" height="430" rx="8" fill="#FF6633"/>
    <text x="36" y="336" fill="#1E2528" font-family="Pathway Extreme, Arial, sans-serif" font-size="27" font-weight="700">TET SIGNAL ORANGE</text>
    <text x="36" y="382" fill="#1E2528" font-family="Pathway Extreme, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="2">#FF6633</text>

    <rect x="440" y="0" width="300" height="430" rx="8" fill="#176B5B"/>
    <text x="472" y="336" fill="#FFFFFF" font-family="Pathway Extreme, Arial, sans-serif" font-size="25" font-weight="700">DEEP EVERGREEN</text>
    <text x="472" y="382" fill="#FFFFFF" font-family="Pathway Extreme, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="2">#176B5B</text>

    <rect x="760" y="0" width="300" height="430" rx="8" fill="#1E2528"/>
    <text x="792" y="336" fill="#FFFFFF" font-family="Pathway Extreme, Arial, sans-serif" font-size="25" font-weight="700">INSIGHT INK</text>
    <text x="792" y="382" fill="#FFFFFF" font-family="Pathway Extreme, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="2">#1E2528</text>

    <rect x="1080" y="0" width="200" height="430" rx="8" fill="#F7F4EE" stroke="#D8D2C8" stroke-width="2"/>
    <text x="1104" y="336" fill="#1E2528" font-family="Pathway Extreme, Arial, sans-serif" font-size="21" font-weight="700">WARM</text>
    <text x="1104" y="366" fill="#1E2528" font-family="Pathway Extreme, Arial, sans-serif" font-size="21" font-weight="700">CANVAS</text>
    <text x="1104" y="406" fill="#1E2528" font-family="Pathway Extreme, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="1">#F7F4EE</text>

    <rect x="1300" y="0" width="100" height="430" rx="8" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="2"/>
    <text x="1324" y="336" fill="#1E2528" font-family="Pathway Extreme, Arial, sans-serif" font-size="18" font-weight="700" transform="rotate(-90 1324 336)">WHITE · #FFFFFF</text>
  </g>

  <line x1="100" y1="794" x2="1500" y2="794" stroke="#D8D2C8" stroke-width="2"/>
  <text x="100" y="844" fill="#5B6264" font-family="Pathway Extreme, Arial, sans-serif" font-size="22">A restrained palette connecting TET's energy with clarity, trust and sustainable impact.</text>
</svg>
