<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">I4I Centre bridge wordmark concept</title>
  <desc id="desc">A text-only I4I Centre logo in Pathway Extreme. The orange crossbar of the numeral four bridges the first dark I to the final green I.</desc>

  <rect width="1600" height="800" fill="#F7F4EE"/>

  <g aria-label="I4I Centre">
    <!-- The extended crossbar turns the 4 into a bridge from ideas to impact. -->
    <path d="M 528 279 H 823" fill="none" stroke="#FF6633" stroke-width="16" stroke-linecap="square"/>

    <text x="470" y="375" fill="#1E2528" font-family="Pathway Extreme, Arial, sans-serif" font-size="300" font-weight="800">I</text>
    <text x="560" y="375" fill="#FF6633" font-family="Pathway Extreme, Arial, sans-serif" font-size="300" font-weight="800">4</text>
    <text x="785" y="375" fill="#176B5B" font-family="Pathway Extreme, Arial, sans-serif" font-size="300" font-weight="800">I</text>

    <text x="501" y="480" fill="#1E2528" font-family="Pathway Extreme, Arial, sans-serif" font-size="70" font-weight="600" letter-spacing="18">CENTRE</text>
  </g>

  <text x="800" y="655" text-anchor="middle" fill="#596164" font-family="Pathway Extreme, Arial, sans-serif" font-size="24" font-weight="400" letter-spacing="2">INNOVATION · INSIGHTS · IMPACT · SUSTAINABILITY</text>
</svg>
